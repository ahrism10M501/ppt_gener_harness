  source_url: https://arxiv.org/pdf/2304.13705
  provider: Zhao et al., 2023
  usage_terms: 원문 이용 조건 미확인; 출처 명시한 연구실 내부 예제
  figure: Figure 4
  pdf_page: 4
  original_caption: 'Architecture of Action Chunking with Transformers (ACT). We train
    ACT as a Conditional VAE (CVAE), which has an encoder and a decoder. Left: The
    encoder of the CVAE compresses action sequence and joint observation into z, the
    style variable. The encoder is discarded at test time. Right: The decoder or policy
    of ACT synthesizes images from multiple viewpoints, joint positions, and z with
    a transformer encoder, and predicts a sequence of actions with a transformer decoder.
    z is simply set to the mean of the prior (i.e. zero) at test time.'
  original_asset: figures/external/act-2023.pdf
