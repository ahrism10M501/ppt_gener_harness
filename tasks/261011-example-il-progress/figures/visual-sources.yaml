  original_caption: 'ALOHA: A Low-cost Open-source Hardware System for Bimanual Teleoperation.
    The whole system costs <$20k with off-the-shelf robots and 3D printed components.
    Left: The user teleoperates by backdriving the leader robots, with the follower
    robots mirroring the motion. Right: ALOHA is capable of precise, contact-rich,
    and dynamic tasks. We show examples of both teleoperated and learned skills.'
