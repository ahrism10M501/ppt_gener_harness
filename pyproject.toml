[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ppt-gener"
version = "0.2.0"
description = "General-purpose multi-template presentation harness with RVLAB preset and anatomy integration"
requires-python = ">=3.11,<3.15"
dependencies = [
  "python-pptx>=1.0.2,<2",
  "lxml>=6,<7",
  "PyYAML>=6,<7",
  "Pillow>=11,<13",
  "PyMuPDF>=1.26,<2",
  "pypandoc-binary>=1.16,<2",
  "pymupdf4llm==0.2.9",
]

[project.optional-dependencies]
visual = [
  "manim>=0.22,<0.23",
  "matplotlib>=3.10,<4",
  "SciencePlots>=2.2,<3",
]

[project.scripts]
pptgen = "rvppt.cli:main"
rvppt = "rvppt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools/rvppt", "tools/pptgen"]
