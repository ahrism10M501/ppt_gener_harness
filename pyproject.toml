[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rvlab-ppt-generator"
version = "0.1.0"
description = "RVLAB template-constrained presentation production"
requires-python = ">=3.11,<3.15"
dependencies = [
  "python-pptx>=1.0.2,<2",
  "lxml>=6,<7",
  "PyYAML>=6,<7",
  "Pillow>=11,<13",
  "PyMuPDF>=1.26,<2",
  "pypandoc-binary>=1.16,<2",
]

[project.scripts]
rvppt = "rvppt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tools/rvppt"]
